<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- mobile status bar color -->
    <meta name="theme-color" content="#fff">
    <title>Crossword</title>
    <link rel="shortcut icon" href="./static/images/logo.svg" type="image/x-icon">
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Potta+One&display=swap" rel="stylesheet">
    <!-- box icons -->
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <!-- app css -->
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="./static/css/crossword.css">
</head>

<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                Generate Puzzles
            </a>
            <div>
                <ul class="nav-links">
                    <div class="dark-mode-toggle" id="dark-mode-toggle">
                        <i class="bx bxs-sun"></i>
                        <i class="bx bxs-moon"></i>
                    </div>
                    
                    <input type="checkbox" id="checkbox_toggle" />
                    <label for="checkbox_toggle" class="hamburger">&#9776;</label>
        
                    <div class="menu">
                        <li><a href="wordsearch.html">Word Search</a></li>
                        <li class="active"><a href="crossword.html">Crossword</a></li>
                        <li><a href="sudoku.html">Sudoku</a></li>
                    </div>
                </ul>
            </div>
        </div>
    </nav>

    <!-- main -->
    <div class="main">
        <div class="screen">
            <!-- start screen -->
            <div class="start-screen active" id="start-screen">
                <div class="btn" id="btn-continue">Continue</div>
                <div class="btn btn-blue" id="btn-play">New game</div>
            </div>
            <!-- end start screen -->

            <!-- settings screen -->
            <div class="settings-screen" id="settings-screen">
                <div class="btn" id="btn-level">
                    Easy
                </div>
                <span>Generate a crossword about </span><input type="text" id="prompt" placeholder="anything" />
                <div class="btn btn-blue" id="btn-start">Start Game</div>
            </div>
            <!-- end settings screen -->

            <!-- game screen -->
            <div class="main-game" id="game-screen">
                <button id="toggleSolution">Reveal Solution</button>
                <div class="main-sudoku-grid">
                    <!-- dynamically insert cells here -->
                </div>
                <table id="unsolved" style="display: block;"></table>
                <table id="solved" style="display: none;"></table>

                <div class="main-game-info">
                    <div class="main-game-info-box main-game-info-level">
                        <span id="game-level">Easy</span>
                    </div>
                    <div class="main-game-info-box main-game-info-time">
                        <span id="game-time">10:20</span>
                        <div class="pause-btn" id="btn-pause">
                            <i class="bx bx-pause"></i>
                        </div>
                    </div>
                </div>

                <div class="words" id="words">
                    <h2>Across</h2>
                    <div class="words-across">
                        <!-- dynamically insert words here -->
                    </div>
                    <h2>Down</h2>
                    <div class="words-down">
                        <!-- dynamically insert words here -->
                    </div>
                </div>
            </div>
            <!-- end game screen -->

            <!-- pause screen -->
            <div class="pause-screen" id="pause-screen">
                <div class="btn btn-blue" id="btn-resume">Resume</div>
                <div class="btn" id="btn-new-game">New game</div>
            </div>
            <!-- end pause screen -->

            <!-- result screen -->
            <div class="result-screen" id="result-screen">
                <div class="congrate">Completed!</div>
                <div class="info">Time</div>
                <div id="result-time"></div>
                <div class="btn" id="btn-new-game-2">New game</div>
            </div>
            <!-- end result screen -->
        </div>
    </div>
    <!-- end main -->

    <!-- axios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.7/axios.min.js" integrity="sha512-NQfB/bDaB8kaSXF8E77JjhHG5PM6XVRxvHzkZiwl3ddWCEPBa23T76MuWSwAJdMGJnmQqM0VeY9kFszsrBEFrQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="./static/js/crossword/constant.js"></script>
    <script src="./static/js/crossword/crossword.js"></script>
    <script src="./static/js/crossword/app.js"></script>
</body>

</html>
